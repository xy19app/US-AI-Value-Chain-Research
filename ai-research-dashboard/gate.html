<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access — US AI Value Chain Investment Research</title>
<meta name="theme-color" content="#F7F4ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Access gate — pitchbook light / terminal dark
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #F7F4ED;
  --panel: #FFFFFF;
  --panel-3: #F0ECDF;
  --text: #1B2337;
  --text-2: #46506A;
  --faint: #7C8498;
  --accent: #B98A2F;
  --accent-dim: rgba(185,138,47,.14);
  --border: rgba(27,35,55,.14);
  --border-soft: rgba(27,35,55,.08);
  --glow: rgba(185,138,47,.10);
  --neg: #C94548;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0F17;
  --panel: #111722;
  --panel-3: #1B2534;
  --text: #E6E9EF;
  --text-2: #B8C0CE;
  --faint: #5B6474;
  --accent: #D4A94E;
  --accent-dim: rgba(212,169,78,.14);
  --border: #1F2937;
  --border-soft: #182130;
  --glow: rgba(212,169,78,.10);
  --neg: #E5484D;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(1100px 520px at 88% -8%, var(--glow), transparent 62%),
    radial-gradient(900px 460px at -10% 108%, var(--glow), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.gate-card {
  position: relative; overflow: hidden;
  background: var(--panel); border: 1px solid var(--border-soft);
  border-radius: 18px; padding: 44px 44px 34px;
  width: 100%; max-width: 440px;
  text-align: center;
  box-shadow: 0 24px 64px -32px rgba(27,35,55,.25);
}
.gate-card::before {
  content: ""; position: absolute; top: -56px; right: -56px; width: 190px; height: 190px;
  background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
  pointer-events: none;
}
.gate-mark {
  width: 46px; height: 46px; border-radius: 12px; margin: 0 auto 14px;
  background: var(--text); color: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 15px;
}
.gate-sub {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
  margin: 0 0 10px;
}
h1 {
  font-family: "Fraunces", Georgia, serif; font-weight: 560;
  font-size: 26px; line-height: 1.2; letter-spacing: -.01em;
  margin: 0 0 8px; text-wrap: balance;
}
.gate-intro { font-size: 13.5px; color: var(--text-2); line-height: 1.6; margin: 0 0 26px; }
#gateForm { display: flex; flex-direction: column; gap: 10px; }
#codeInput {
  font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: .35em;
  text-align: center; color: var(--text);
  background: var(--panel-3); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 12px; width: 100%;
  outline: none; transition: border-color .15s cubic-bezier(.2,0,0,1);
}
#codeInput:focus { border-color: var(--accent); }
button {
  font-family: "Inter", sans-serif; font-size: 14px; font-weight: 600;
  background: var(--text); color: var(--bg);
  border: 1px solid transparent; border-radius: 10px;
  padding: 12px 18px; cursor: pointer;
  transition: background-color .18s cubic-bezier(.2,0,0,1), color .18s cubic-bezier(.2,0,0,1);
}
button:hover { background: var(--accent); color: var(--bg); }
.gate-error {
  margin: 12px 0 0; font-family: "IBM Plex Mono", monospace;
  font-size: 12px; color: var(--neg);
}
.gate-foot {
  margin: 28px 0 0; padding-top: 16px;
  border-top: 1px dashed var(--border-soft);
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  letter-spacing: .06em; color: var(--faint);
}
.shake { animation: shake .3s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake {
  10%, 90% { transform: translateX(-1px); }
  20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-3px); }
  40%, 60% { transform: translateX(3px); }
}
@media (max-width: 480px) {
  .gate-card { padding: 32px 22px 26px; }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>
<main>
  <div class="gate-card">
    <div class="gate-mark">AI</div>
    <p class="gate-sub">Independent Investment Research · Aug 2026</p>
    <h1>US AI Value-Chain Research</h1>
    <p class="gate-intro">This dashboard is shared selectively. Enter the access code to continue.</p>
    <form id="gateForm">
      <input type="password" inputmode="numeric" maxlength="8" id="codeInput" placeholder="Access code" autocomplete="off" aria-label="Access code">
      <button type="submit">Enter →</button>
    </form>
    <p class="gate-error" id="gateError" hidden>Incorrect code — try again.</p>
    <p class="gate-foot">Research snapshot · 9 August 2026 · Not investment advice</p>
  </div>
</main>
<script>
(function () {
  "use strict";
  /* already unlocked this session → go straight through, restoring any deep link */
  try {
    if (sessionStorage.getItem("ai1-gate") === "open") {
      location.replace("index.html" + (sessionStorage.getItem("ai1-return") || ""));
      return;
    }
  } catch (e) { /* private browsing */ }

  /* follow the saved pitchbook / terminal theme */
  var t = null;
  try { t = localStorage.getItem("ai1-theme"); } catch (e) { /* private mode */ }
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");

  var form = document.getElementById("gateForm");
  var input = document.getElementById("codeInput");
  var err = document.getElementById("gateError");

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (input.value.trim() === "1001") {
      try {
        sessionStorage.setItem("ai1-gate", "open");
        var back = sessionStorage.getItem("ai1-return") || "";
        sessionStorage.removeItem("ai1-return");
        location.replace("index.html" + back);
      } catch (e) {
        location.replace("index.html");
      }
    } else {
      err.hidden = false;
      input.value = "";
      input.focus();
      form.classList.remove("shake");
      void form.offsetWidth; /* restart the animation */
      form.classList.add("shake");
    }
  });

  input.focus();
})();
</script>
</body>
</html>
